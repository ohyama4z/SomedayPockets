# gitleaks 設定ファイル
# 既存コードベースをスキャンした結果、現時点で誤検知（false positive）はゼロ。
# 本設定は gitleaks の標準ルールをそのまま継承しつつ、将来の誤検知を防ぐための
# 最小限の allowlist のみを定義する。

# gitleaks 標準ルール一式を継承する（[[rules]] を上書きせず追加運用する）
[extend]
useDefault = true

[allowlist]
description = "プロジェクト固有の許可リスト（公開前提のリソースIDやビルド成果物を除外）"

# スキャン対象から除外するパス
#  - node_modules / ビルド成果物: 第三者コードやデプロイ生成物で、ソース管理対象外
#  - drizzle のマイグレーション: 自動生成SQL（秘密は含めない運用）
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)\.open-next/''',
  '''(^|/)\.next/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)package-lock\.json$''',
]

# 許可する具体的な値（regex一致）
#  - Cloudflare D1 の database_id は「公開しても危険でないリソース識別子」であり
#    秘密情報ではない（アクセスにはアカウント認証が別途必要）。誤検知防止のため明示許可する。
regexes = [
  '''09288a14-5000-4c5e-81e3-a07dfc119475''',
]
