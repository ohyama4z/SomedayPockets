name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    name: ユニットテスト
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

  e2e-test:
    name: E2Eテスト
    runs-on: ubuntu-latest
    # 万一 dev サーバや E2E がハングしても、ジョブを短時間で打ち切る安全装置
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # ローカルD1へマイグレーションを適用してから dev を起動する
      - run: npx wrangler d1 migrations apply someday-pockets-db --local
      # dev サーバをバックグラウンド起動する（Playwright には起動させない）。
      # workerd の teardown ハングを避けるため、サーバのライフサイクルは CI 側が持つ。
      - name: devサーバをバックグラウンド起動
        run: nohup npm run dev > dev-server.log 2>&1 &
      # dev サーバの応答を待つ
      - run: npx wait-on -t 60000 http://localhost:3000
      - run: npm run test:e2e

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint